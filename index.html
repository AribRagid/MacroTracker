<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#121512"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Your daily calories and protein. Simple, private, and saved on your device."><title>Macro · Daily tracker</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23121512'/%3E%3Cpath d='M15 44V20l17 18 17-18v24' fill='none' stroke='%23d2f88a' stroke-width='7' stroke-linejoin='round'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header><button class="icon" id="history-nav" aria-label="History"><svg viewBox="0 0 24 24"><path d="M12 5v15M12 5C9 3 5 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-6-1-9 1Z"/></svg></button><button class="brand" id="home-nav" aria-label="Go to today">macro<span>•</span></button><button class="icon" id="settings-nav" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button></header>
<main id="today" class="page today"><div class="day-heading"><h1>Keep Tracking</h1></div><div class="entry-grid"><form id="calories-form" class="entry"><label for="calories-input"><span class="metric-mark calorie-mark">↗</span>Calories</label><div class="number-field"><input id="calories-input" type="number" inputmode="decimal" min="0.1" max="100000" step="0.1" placeholder="0" required aria-label="Calories to add"><span>kcal</span></div><button class="add calorie-button" type="submit">+ Add calories</button></form><form id="protein-form" class="entry"><label for="protein-input"><span class="metric-mark protein-mark">◈</span>Protein</label><div class="number-field"><input id="protein-input" type="number" inputmode="decimal" min="0.1" max="100000" step="0.1" placeholder="0" required aria-label="Protein to add"><span>g</span></div><button class="add protein-button" type="submit">+ Add protein</button></form></div><section class="daily-progress"><div class="section-line"><h2>Today’s progress</h2><span id="entry-count">0 entries</span></div><div class="totals-grid" id="today-totals"></div></section></main>
<main id="history" class="page" hidden><div class="page-heading"><h1>History</h1></div><div class="month-line"><h2 id="month-label"></h2><div><button class="icon small" id="prev-week" aria-label="Previous week">‹</button><button class="icon small" id="next-week" aria-label="Next week">›</button></div></div><div id="week" class="week" aria-label="Select a day"></div><div class="history-heading"><h2 id="selected-label"></h2><button id="jump-today" class="text-button">Today</button></div><button class="wide add-history" id="add-history">+ Enter calories or protein</button><div id="logs" class="logs"></div><nav id="log-pagination" class="log-pagination" aria-label="Entry pages"><button id="prev-logs" class="text-button">Previous</button><span id="log-page-count"></span><button id="next-logs" class="text-button">Next</button></nav><div id="history-totals" class="history-totals"></div></main>
<main id="settings" class="page" hidden><div class="page-heading"><h1>Settings</h1></div><section class="settings-card"><h2>Daily goals</h2><form id="goals-form"><div class="goal-field"><label for="calorie-goal">Calories <span>kcal / day</span></label><input id="calorie-goal" type="number" inputmode="decimal" min="0.1" max="100000" step="0.1" placeholder="Set your goal" required></div><div class="goal-field"><label for="protein-goal">Protein <span>g / day</span></label><input id="protein-goal" type="number" inputmode="decimal" min="0.1" max="100000" step="0.1" placeholder="Set your goal" required></div><button class="wide calorie-button">Save goals</button></form></section><section class="settings-card"><h2>Appearance</h2><div class="segmented" aria-label="Colour mode"><button id="light-mode">☀ Light</button><button id="dark-mode">☾ Dark</button></div></section><section class="settings-card"><h2>Your data</h2><p class="muted">Saved on this phone. Back up your entries and goals.</p><div class="backup-actions"><button class="wide secondary" id="export">↓ Download data</button><button class="wide secondary" id="import">↑ Import data</button></div><input id="import-file" type="file" accept=".json,application/json" hidden><p class="fine">Import replaces current data after confirmation.</p></section></main>
</div><div id="toast" role="status" aria-live="polite"></div><dialog id="entry-dialog"><form id="past-form"><div class="dialog-heading"><h2>Add an entry</h2><button class="icon small" type="button" data-close="entry-dialog" aria-label="Close">×</button></div><p class="muted" id="past-date"></p><label for="past-type">Nutrient</label><select id="past-type"><option value="calories">Calories (kcal)</option><option value="protein">Protein (g)</option></select><label for="past-value">Amount</label><input id="past-value" type="number" min="0.1" max="100000" step="0.1" inputmode="decimal" required><label for="past-time">Time</label><input id="past-time" type="time" required><p class="fine">Times before 3 a.m. belong to the following calendar morning.</p><button class="wide calorie-button">Add entry</button></form></dialog><dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p class="muted" id="confirm-message"></p><div class="confirm-actions"><button class="secondary" id="confirm-cancel">Cancel</button><button class="danger" id="confirm-ok">Remove</button></div></dialog><script src="app.js"></script></body></html>
